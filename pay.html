<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>付款｜B服代練工作室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235ee0c7'/%3E%3Cstop offset='1' stop-color='%237aa8ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M22 16h13c6 0 10 3 10 8 0 3-2 6-5 7 4 1 7 4 7 8 0 6-5 9-11 9H22z M30 23v7h4c2 0 3-1 3-3.5S36 23 34 23z M30 37v8h5c2.5 0 4-1.5 4-4s-1.5-4-4-4z' fill='%230b1220'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--bg2:#0e1324;--panel:#131a2e;--panel2:#1a2240;--panel3:#212b4d;--line:#243056;--line2:#2f3c6b;--text:#e9ecf8;--muted:#8e97c0;--dim:#5f6894;
  --accent:#5ee0c7;--blue:#7aa8ff;--gold:#ffc861;--danger:#ff6b81;--ok:#4fd18b;--pp:#0070e0;--grad:linear-gradient(135deg,#5ee0c7,#7aa8ff)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(800px 420px at 10% 0%,rgba(94,224,199,.13),transparent 60%),radial-gradient(700px 420px at 100% 100%,rgba(122,168,255,.12),transparent 60%),var(--bg);
  color:var(--text);font:15px/1.65 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;color:var(--text);margin-bottom:22px}
.brand svg{width:34px;height:34px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:22px;margin-bottom:16px}
.amount{text-align:center;padding:6px 0 4px}
.amount small{color:var(--muted);font-size:13px}
.amount b{display:block;font-size:44px;font-weight:700;line-height:1.2;margin:4px 0}
.amount .desc{color:#c3cbea;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:99px}
.tag.pending{background:rgba(255,200,97,.14);color:var(--gold)} .tag.reported{background:rgba(122,168,255,.15);color:var(--blue)}
.tag.paid{background:rgba(79,209,139,.15);color:var(--ok)} .tag.cancelled{background:rgba(255,107,129,.12);color:var(--danger)}
.tabs{display:flex;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:10px;border-radius:10px;cursor:pointer}
.tabs button.act{background:var(--panel3);color:var(--text)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);font-size:13.5px;white-space:nowrap}
.kv b{text-align:right;word-break:break-all}
button,.btn{font:inherit;font-weight:700;border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:11px 18px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--grad);border-color:transparent;color:#07131a;width:100%;padding:14px}
button.primary:hover{color:#07131a;filter:brightness(1.07)}
button:disabled{opacity:.45;cursor:not-allowed}
.copy{padding:4px 10px;font-size:12.5px;border-radius:8px;margin-left:8px}
.btn.pp{background:var(--pp);border-color:var(--pp);color:#fff;width:100%;padding:14px}
.btn.pp:hover{filter:brightness(1.1);color:#fff}
input,select{font:inherit;width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--text);border-radius:12px;padding:11px 13px;margin-top:6px}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,224,199,.15)}
label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:12px}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:2px}
.note{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13.5px;color:#c3cbea;white-space:pre-wrap}
.center{text-align:center}
.big-ic{font-size:52px;line-height:1}
.steps{margin:0;padding-left:20px;color:#c3cbea;font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:9}
.toast.show{display:block}
.spin{width:30px;height:30px;border:3px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite;margin:20px auto}
@keyframes r{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--dim);font-size:12.5px;margin-top:26px}
footer a{color:var(--dim)}

/* ============ 換頁過場 ============ */
@view-transition{navigation:auto}
::view-transition-old(root){animation:vtOut .3s cubic-bezier(.4,0,.2,1) both}
::view-transition-new(root){animation:vtIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes vtOut{to{opacity:0;transform:scale(.985);filter:blur(8px)}}
@keyframes vtIn{from{opacity:0;transform:scale(1.02);filter:blur(8px)}}
.pt-curtain{position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;transition:opacity .28s ease;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(600px 400px at 50% 45%,rgba(94,224,199,.16),transparent 70%),#0a0e1a}
.pt-curtain svg{width:58px;height:58px;filter:drop-shadow(0 0 18px rgba(94,224,199,.6));transform:scale(.8);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
html.pt-leave .pt-curtain{opacity:1;pointer-events:auto}
html.pt-leave .pt-curtain svg{transform:scale(1)}
html.pt-enter .pt-curtain{opacity:1;transition:none}
html.pt-enter.pt-go .pt-curtain{opacity:0;transition:opacity .45s ease .05s}
@media (prefers-reduced-motion: reduce){::view-transition-old(root),::view-transition-new(root){animation:none}.pt-curtain{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee0c7"/><stop offset="1" stop-color="#7aa8ff"/></linearGradient>
  <symbol id="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="url(#lg)"/><path d="M22 16h13c6 0 10 3 10 8 0 3-2 6-5 7 4 1 7 4 7 8 0 6-5 9-11 9H22z M30 23v7h4c2 0 3-1 3-3.5S36 23 34 23z M30 37v8h5c2.5 0 4-1.5 4-4s-1.5-4-4-4z" fill="#0b1220"/></symbol>
</defs></svg>
<div class="wrap">
  <a class="brand" href="./"><svg><use href="#logo"/></svg>B服代練工作室</a>
  <div id="root"><div class="card center"><div class="spin"></div><div class="hint">載入付款資訊中…</div></div></div>
  <footer>付款有任何問題，請在 Discord 私訊與你聯繫的工作人員・<a href="./">回到首頁</a></footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'NT$ ' + Math.round(n||0).toLocaleString();
const token = (new URLSearchParams(location.search).get('t') || location.hash.slice(1) || '').trim();
let P = null, PAY = null, tab = 'bank', api = null;

function toast(m){ const t = $('#toast'); t.textContent = m; t.className = 'toast show'; clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2500); }
async function copy(v){ try { await navigator.clipboard.writeText(v); toast('已複製：' + v); } catch(e){ toast('請手動複製：' + v); } }
const STATUS = { pending:['等待付款','pending'], reported:['已回報，等待對帳','reported'], paid:['已確認收款','paid'], cancelled:['連結已失效','cancelled'] };

function view(html){ $('#root').innerHTML = html; }
function render(){
  if (!P) return;
  const st = STATUS[P.status] || STATUS.pending;
  const head = `<div class="card"><div class="amount"><small>應付金額</small><b class="mono">${money(P.amount)}</b>
    <div class="desc">${esc(P.client || '')}${P.desc ? '・' + esc(P.desc) : ''}</div>
    <div style="margin-top:10px"><span class="tag ${st[1]}">${st[0]}</span></div></div>
    ${P.note ? `<div class="note" style="margin-top:14px">📝 ${esc(P.note)}</div>` : ''}</div>`;

  if (P.status === 'paid') return view(head + `<div class="card center"><div class="big-ic">✅</div><h2 style="margin:10px 0 4px">已確認收款</h2>
    <p class="hint">感謝你的付款！代練師會依約定開始／繼續代練，進度可以隨時在 Discord 詢問。</p></div>`);
  if (P.status === 'cancelled') return view(head + `<div class="card center"><div class="big-ic">⚠️</div><h2 style="margin:10px 0 4px">此付款連結已失效</h2>
    <p class="hint">請在 Discord 向我們索取新的付款連結。</p></div>`);

  const bank = PAY && PAY.bank && PAY.bank.account ? PAY.bank : null;
  const pp = PAY && /^https:\/\/(www\.)?paypal\.me\//i.test(PAY.paypalMe || '') ? PAY.paypalMe.replace(/\/+$/, '') : '';
  if (!bank && !pp) return view(head + `<div class="card center"><p class="hint">工作室還沒設定付款方式，請在 Discord 與我們確認付款方式。</p></div>`);
  if (tab === 'bank' && !bank) tab = 'paypal';
  if (tab === 'paypal' && !pp) tab = 'bank';
  const ppAmt = PAY.paypalCurrency ? `/${Math.round(P.amount)}${PAY.paypalCurrency}` : '';

  const bankHtml = bank ? `
    <div class="kv"><span>銀行</span><b>${esc(bank.name)}${bank.code ? `（代碼 <span class="mono">${esc(bank.code)}</span>）` : ''}<button class="copy" data-c="${esc(bank.code || bank.name)}">複製</button></b></div>
    ${bank.branch ? `<div class="kv"><span>分行</span><b>${esc(bank.branch)}</b></div>` : ''}
    <div class="kv"><span>戶名</span><b>${esc(bank.holder)}</b></div>
    <div class="kv"><span>帳號</span><b class="mono" style="font-size:18px">${esc(bank.account)}<button class="copy" data-c="${esc(bank.account.replace(/[\s-]/g,''))}">複製</button></b></div>
    <div class="kv"><span>金額</span><b class="mono">${money(P.amount)}<button class="copy" data-c="${Math.round(P.amount)}">複製</button></b></div>
    ${PAY.bankNote ? `<div class="note" style="margin-top:12px">${esc(PAY.bankNote)}</div>` : ''}` : '';
  const ppHtml = pp ? `
    <p class="hint" style="margin-top:0">點下方按鈕會開啟 PayPal 付款頁${ppAmt ? '，金額已自動帶入' : `，請輸入金額 <b class="mono" style="color:var(--text)">${money(P.amount)}</b>`}。</p>
    <a class="btn pp" href="${esc(pp + ppAmt)}" target="_blank" rel="noopener">前往 PayPal 付款 ↗</a>
    <div class="hint" style="margin-top:10px">付款完成後，請在 PayPal 的交易明細找到「交易編號」（Transaction ID），填在下方回報。</div>
    ${PAY.paypalNote ? `<div class="note" style="margin-top:12px">${esc(PAY.paypalNote)}</div>` : ''}` : '';

  const reported = P.status === 'reported' && P.report;
  view(head + `
    <div class="card">
      <h3 style="margin:0 0 14px">① 選擇付款方式</h3>
      ${bank && pp ? `<div class="tabs"><button data-tab="bank" class="${tab==='bank'?'act':''}">🏦 銀行轉帳</button><button data-tab="paypal" class="${tab==='paypal'?'act':''}">🅿️ PayPal</button></div>` : ''}
      ${tab === 'bank' ? bankHtml : ppHtml}
    </div>
    <div class="card">
      <h3 style="margin:0 0 4px">② 付款完成後回報</h3>
      ${reported ? `<div class="note" style="margin:10px 0 14px;border-color:rgba(122,168,255,.4)">✅ 已收到你的回報：${P.report.method === 'bank' ? '銀行轉帳・帳號後五碼' : 'PayPal・交易編號'} <b class="mono">${esc(P.report.ref)}</b><br>工作室對帳後會在 Discord 通知你。如果填錯可以重新送出。</div>` : '<p class="hint" style="margin:0 0 14px">讓我們能快速對帳，回報後工作室會盡快確認。</p>'}
      <form id="fRep" novalidate>
        <label>付款方式<select name="method">${bank ? `<option value="bank" ${tab==='bank'?'selected':''}>銀行轉帳</option>` : ''}${pp ? `<option value="paypal" ${tab==='paypal'?'selected':''}>PayPal</option>` : ''}</select></label>
        <label id="refLbl">${tab === 'paypal' ? 'PayPal 交易編號' : '轉出帳號後五碼'}<input name="ref" maxlength="40" autocomplete="off" placeholder="${tab === 'paypal' ? '例：8AB12345CD678901E' : '例：12345'}"></label>
        <label>付款人姓名 / PayPal 名稱（選填）<input name="name" maxlength="30"></label>
        <div class="err" id="repErr"></div>
        <button class="primary" id="repBtn">${reported ? '重新送出回報' : '我已付款，送出回報'}</button>
      </form>
    </div>`);
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-c]'); if (c){ e.preventDefault(); copy(c.dataset.c); return; }
  const t = e.target.closest('[data-tab]'); if (t){ tab = t.dataset.tab; render(); }
});
document.addEventListener('change', e => {
  if (e.target.name === 'method'){ const pp = e.target.value === 'paypal';
    $('#refLbl').firstChild.textContent = pp ? 'PayPal 交易編號' : '轉出帳號後五碼';
    document.querySelector('[name=ref]').placeholder = pp ? '例：8AB12345CD678901E' : '例：12345'; }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fRep') return; e.preventDefault();
  const f = e.target, method = f.method.value, ref = f.ref.value.trim().toUpperCase(), name = f.name.value.trim();
  const err = $('#repErr'); err.textContent = '';
  if (method === 'bank' && !/^\d{5}$/.test(ref)) return err.textContent = '請輸入轉出帳號的後五碼（5 個數字）';
  if (method === 'paypal' && !/^[A-Z0-9]{8,30}$/.test(ref)) return err.textContent = '請輸入 PayPal 交易編號（英文字母和數字，通常 17 碼）';
  const btn = $('#repBtn'); btn.disabled = true; btn.textContent = '送出中…';
  try {
    await api.report(token, { method, ref, name, at: Date.now() });
    P.status = 'reported'; P.report = { method, ref, name }; render(); toast('已送出付款回報');
  } catch(ex){ console.error(ex); err.textContent = '送出失敗，請稍後再試或直接到 Discord 告訴我們（' + (ex.code || ex.message) + '）'; btn.disabled = false; btn.textContent = '我已付款，送出回報'; }
});

window.Pay = {
  attach(a){
    api = a;
    if (!/^[A-Za-z0-9]{16,40}$/.test(token)) return view(`<div class="card center"><div class="big-ic">🔗</div><h2 style="margin:10px 0 4px">付款連結不完整</h2><p class="hint">請確認你打開的是工作室在 Discord 傳給你的完整連結。</p></div>`);
    a.watchPay(v => { PAY = v; render(); });
    a.watchPayment(token, d => {
      if (!d) return view(`<div class="card center"><div class="big-ic">🔍</div><h2 style="margin:10px 0 4px">找不到這筆付款</h2><p class="hint">連結可能已失效或輸入錯誤，請在 Discord 向我們確認。</p></div>`);
      P = d; render();
    }, e => view(`<div class="card center"><div class="big-ic">⚠️</div><h2 style="margin:10px 0 4px">讀取失敗</h2><p class="hint">${esc(e.code || e.message)}，請稍後重新整理。</p></div>`));
  }
};
</script>

<script type="module">
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAqJzMNsxaGX2L53LozPPBpshjfda7JPtA",
  authDomain: "boost-70cf2.firebaseapp.com",
  projectId: "boost-70cf2",
  storageBucket: "boost-70cf2.firebasestorage.app",
  messagingSenderId: "1000095594482",
  appId: "1:1000095594482:web:16306642fae64622da9d6b",
  measurementId: "G-PPBNB0C7G1"
};
if (window.__MOCK_PAY) Pay.attach(window.__MOCK_PAY);
else {
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{ initializeApp }, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
  const db = F.getFirestore(initializeApp(FIREBASE_CONFIG));
  Pay.attach({
    watchPay: cb => F.onSnapshot(F.doc(db, 'settings', 'pay'), s => cb(s.exists() ? s.data() : null), () => cb(null)),
    watchPayment: (id, cb, err) => F.onSnapshot(F.doc(db, 'payments', id), s => cb(s.exists() ? s.data() : null), err),
    report: (id, report) => F.updateDoc(F.doc(db, 'payments', id), { status: 'reported', report }),
  });
}
</script>
<script>
// 換頁過場：支援的瀏覽器（Chrome / Edge / Comet）用原生 View Transitions，其他瀏覽器用淡出淡入
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if ('CSSViewTransitionRule' in window) return;
  const cur = document.createElement('div'); cur.className = 'pt-curtain';
  cur.innerHTML = '<svg viewBox="0 0 64 64"><defs><linearGradient id="ptg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee0c7"/><stop offset="1" stop-color="#7aa8ff"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#ptg)"/><path d="M22 16h13c6 0 10 3 10 8 0 3-2 6-5 7 4 1 7 4 7 8 0 6-5 9-11 9H22z M30 23v7h4c2 0 3-1 3-3.5S36 23 34 23z M30 37v8h5c2.5 0 4-1.5 4-4s-1.5-4-4-4z" fill="#0b1220"/></svg>';
  document.body.appendChild(cur);
  const H = document.documentElement;
  H.classList.add('pt-enter'); requestAnimationFrame(() => requestAnimationFrame(() => H.classList.add('pt-go')));
  setTimeout(() => H.classList.remove('pt-enter', 'pt-go'), 700);
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === '_blank' || a.hasAttribute('download')) return;
    const u = new URL(a.href, location.href);
    if (u.origin !== location.origin || (u.pathname === location.pathname && u.search === location.search)) return;
    e.preventDefault(); H.classList.add('pt-leave'); setTimeout(() => { location.href = u.href; }, 280);
  });
  addEventListener('pageshow', e => { if (e.persisted) H.classList.remove('pt-leave'); });
})();
</script>
</body>
</html>
